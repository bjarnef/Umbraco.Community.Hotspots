name: Release Package

# This action will start when a correctly formatted tag is pushed (e.g. 0.1.0)

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 10.0.x
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install client dependencies
      run: npm ci
      working-directory: src/Umbraco.Community.Hotspots/Client

    - name: Type-check client
      run: npm run check
      working-directory: src/Umbraco.Community.Hotspots/Client

    - name: Build client
      run: npm run build
      working-directory: src/Umbraco.Community.Hotspots/Client
  
    - name: Build & Pack
      run: dotnet pack src/Umbraco.Community.Hotspots/Umbraco.Community.Hotspots.csproj -c Release /p:Version=${{github.ref_name}}

    - name: Push to NuGet
      run: dotnet nuget push **/*.nupkg --api-key ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json

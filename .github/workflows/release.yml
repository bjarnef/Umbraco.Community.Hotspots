name: Release Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install client dependencies
      run: npm ci
      working-directory: src/Umbraco.Community.Hotspots/Client

    - name: Type-check client
      run: npm run check
      working-directory: src/Umbraco.Community.Hotspots/Client

    - name: Build client
      run: npm run build
      working-directory: src/Umbraco.Community.Hotspots/Client
  
    - name: Build & Pack
      env:
        VERSION: ${{ github.ref_name }}
      run: dotnet pack src/Umbraco.Community.Hotspots/Umbraco.Community.Hotspots.csproj -c Release /p:Version=${VERSION#v}

    - name: Push to NuGet
      run: dotnet nuget push **/*.nupkg -k ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json
